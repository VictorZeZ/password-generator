name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 MSI
            os: windows-latest
            runtime: win-x64
            platform: windows

          - name: Linux x64
            os: ubuntu-latest
            runtime: linux-x64
            platform: linux

          - name: macOS x64
            os: macos-latest
            runtime: osx-x64
            platform: macos

          - name: macOS ARM64
            os: macos-latest
            runtime: osx-arm64
            platform: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: ga

      - name: Restore
        run: dotnet restore password-generator/password-generator.csproj

      - name: Build Windows MSI installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .\scripts\build-installer.ps1 -Runtime ${{ matrix.runtime }}

      - name: Publish Unix executable
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf artifacts/publish

          dotnet publish password-generator/password-generator.csproj \
            --configuration Release \
            --runtime "${{ matrix.runtime }}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            --output artifacts/publish

          test -f artifacts/publish/pg

          mkdir -p release
          cp artifacts/publish/pg release/
          cp README.md release/

          tar -czf "pg-${{ matrix.runtime }}.tar.gz" -C release .

      - name: Upload Windows installer
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: pg-windows-x64-msi
          path: artifacts/installer/*.msi
          if-no-files-found: error

      - name: Upload Unix archive
        if: matrix.platform != 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: pg-${{ matrix.runtime }}
          path: pg-${{ matrix.runtime }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Replacing existing assets..."
            gh release upload "$TAG" release-assets/* --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" \
              release-assets/* \
              --verify-tag \
              --title "Password Generator $TAG" \
              --generate-notes
          fi
