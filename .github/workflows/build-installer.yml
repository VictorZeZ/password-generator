name: Build Windows MSI Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-installer:
    name: Build installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build installer
        shell: pwsh
        run: .\scripts\build-installer.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: pg-windows-msi-installer
          path: artifacts/installer/**/*.msi

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            artifacts/installer/**/*.msi `
            --title "Password Generator ${{ github.ref_name }}" `
            --notes "Download the Windows MSI installer, run it, then open a new terminal and use pg."
